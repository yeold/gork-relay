# Build gork-relay and run its checks, with the packet socket and with
# libpcap.  The eth: link is tried on a tap device, which needs root.
name: build

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y libssl-dev libpcap-dev
      - run: make CFLAGS="-O2 -Wall -W -Werror"
      - run: make check 2>&1 | tee test.log
      - name: the eth link, on a tap device
        run: sudo RELAYTEST_TAP=1 python3 test/relaytest.py ./gork-relay 2>&1 | tee -a test.log
      - name: the same through libpcap
        run: |
          make clean
          make PCAP=1 CFLAGS="-O2 -Wall -W -Werror"
          sudo RELAYTEST_TAP=1 python3 test/relaytest.py ./gork-relay 2>&1 | tee -a test.log
      # The log needs a login to read; an annotation does not.
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=relaytest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
